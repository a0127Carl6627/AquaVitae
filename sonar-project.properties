# Configuración de SonarCloud — AquaVitae (front)
# Se excluyen del análisis los archivos de PRUEBA y mocks, ya que no son
# código de producción (práctica estándar). Esto evita issues "fantasma"
# como métodos vacíos en los stubs de los tests.
sonar.exclusions=**/__tests__/**,**/__mocks__/**,**/cypress/**,**/*.test.js,**/*.test.jsx,**/*.cy.js,**/*.stories.js,**/*.stories.jsx
